name: CI Pipeline

on:

  push:
    branches:
      - main  # Run on pushes made into the main branch

  pull_request:

    branches:
      - main  # Run on pull requests targeting the main branch

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9' # Subject to change

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest pre-commit  # Ensuring proper installs

      - name: Run pre-commit
        run: |
          pre-commit run --all-files  # Run Pre-Commit hooks

      - name: Run pylint
        run: |
          pylint $(git ls-files '*.py') #Run Pylint on necessary code (could change to include specified files)

  unit-Tests:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v2


      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9' # Subject to change

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # Ensuring pytest is installed

      - name: Run unit tests
        run: |
          pytest test_model.py

  happy-sad-path-Tests:
    runs-on: ubuntu-latest
    needs: unit-Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v2


      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9' # Subject to change

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # Ensuring pytest is installed

      - name: Run happy and sad path tests
        run: |
          pytest test_happy_path.py
          pytest test_sad_path.py

  acceptance-Tests:
    runs-on: ubuntu-latest
    needs: happy-sad-path-Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v2


      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9' # Subject to change

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # Ensuring pytest is installed

      - name: Run acceptance tests
        run: |
          pytest test_acceptance_sad.py
          pytest test_acceptance_happy.py
          pytest test_acceptance_edge_cases.py
